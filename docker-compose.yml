services:
  mysql:
    image: mysql:8.0
    container_name: fixmanager-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - fixmanager_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/fixmanager-backend
      dockerfile: Dockerfile
    container_name: fixmanager-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_APPLICATION_NAME: fixmanager-backend
      FIXMANAGER_ADMIN_EMAIL: ${FIXMANAGER_ADMIN_EMAIL:-}
      FIXMANAGER_ADMIN_PASSWORD: ${FIXMANAGER_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  fixmanager_mysql_data: